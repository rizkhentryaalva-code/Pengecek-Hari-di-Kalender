<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalender dan Pengecekan Tanggal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            background-color: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #4778a8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #315d87;
        }

        #hasil {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef4fa;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Kalender dan Pengecekan Tanggal</h2>

    <label>Tanggal</label>
    <input type="number" id="tanggal" placeholder="Masukkan tanggal">

    <label>Bulan</label>
    <select id="bulan" style="width:100%; padding:10px; margin-top:5px;">
        <option value="">Pilih Bulan</option>
        <option value="1">Januari</option>
        <option value="2">Februari</option>
        <option value="3">Maret</option>
        <option value="4">April</option>
        <option value="5">Mei</option>
        <option value="6">Juni</option>
        <option value="7">Juli</option>
        <option value="8">Agustus</option>
        <option value="9">September</option>
        <option value="10">Oktober</option>
        <option value="11">November</option>
        <option value="12">Desember</option>
    </select>

    <label>Tahun</label>
    <input type="number" id="tahun" placeholder="Masukkan tahun">

    <button onclick="cekTanggal()">Periksa Tanggal</button>

    <div id="hasil"></div>
</div>

<script>
function cekTanggal() {
    let tanggal = Number(document.getElementById("tanggal").value);
    let bulan = Number(document.getElementById("bulan").value);
    let tahun = Number(document.getElementById("tahun").value);

    let hasil = document.getElementById("hasil");

    if (!tanggal || !bulan || !tahun || tahun < 1 ||
        !Number.isInteger(tanggal) ||
        !Number.isInteger(bulan) ||
        !Number.isInteger(tahun)) {
        alert("Masukkan tanggal, bulan, dan tahun dengan benar!");
        return;
    }

    // Mengecek tahun kabisat
    let kabisat = false;

    if (tahun % 400 == 0) {
        kabisat = true;
    } else if (tahun % 100 == 0) {
        kabisat = false;
    } else if (tahun % 4 == 0) {
        kabisat = true;
    }

    // Menentukan jumlah hari dalam bulan
    let jumlahHari = 31;

    if (bulan == 4 || bulan == 6 ||
        bulan == 9 || bulan == 11) {
        jumlahHari = 30;
    } else if (bulan == 2) {
        if (kabisat) {
            jumlahHari = 29;
        } else {
            jumlahHari = 28;
        }
    }

    // Memeriksa validitas tanggal
    if (tanggal < 1 || tanggal > jumlahHari) {
        alert("Tanggal tidak valid!");
        return;
    }

    // Menghitung nama hari dengan modulo 7
    let t = [0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4];

    let y = tahun;

    if (bulan < 3) {
        y--;
    }

    let hari = (y + Math.floor(y / 4)
        - Math.floor(y / 100)
        + Math.floor(y / 400)
        + t[bulan - 1] + tanggal) % 7;

    let namaHari = [
        "Minggu", "Senin", "Selasa",
        "Rabu", "Kamis", "Jumat", "Sabtu"
    ];

    // Menentukan akhir pekan
    let akhirPekan = "";

    if (hari == 0 || hari == 6) {
        akhirPekan = "Akhir pekan";
    } else {
        akhirPekan = "Hari kerja";
    }

    // Menampilkan hasil
    hasil.style.display = "block";

    hasil.innerHTML = `
        <h3>Hasil Pengecekan</h3>
        <p>Hari: <b>${namaHari[hari]}</b></p>
        <p>Tahun Kabisat: <b>${kabisat ? "Ya" : "Tidak"}</b></p>
        <p>Jumlah Hari dalam Bulan: <b>${jumlahHari} hari</b></p>
        <p>Keterangan: <b>${akhirPekan}</b></p>
    `;
}
</script>

</body>
</html>
